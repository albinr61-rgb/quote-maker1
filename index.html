<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Quote Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600&display=swap">
<style>
/* Layout: five full screens (home, make, list, products, settings) in one page, header with back arrow, warm cream and brown like the reference app. Quotation preview is a paper sheet with a diagonal watermark. */
:root{
  --bg:#FFF5EC; --surface:#FFFDFB; --ink:#2A1C14; --muted:#7A6455; --line:#E7D6C8;
  --accent:#8D4F2B; --accent-ink:#FFFFFF; --chip:#EBE0D7; --sel:#F4DFCF; --bad:#B3261E; --card2:#E4DAD2;
  --paper:#FFFFFF; --paper-ink:#241A14; --paper-line:#D9CFC6;
  --display:"Mukta Malar","Noto Sans Tamil",system-ui,sans-serif;
  --body:"Noto Sans Tamil","Mukta Malar",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1310; --surface:#261B16; --ink:#F4E9E0; --muted:#B39D8E; --line:#3B2C24;
  --accent:#E3A47E; --accent-ink:#1B1310; --chip:#33251E; --sel:#43291C; --bad:#F2877F; --card2:#33261F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1310; --surface:#261B16; --ink:#F4E9E0; --muted:#B39D8E; --line:#3B2C24;
  --accent:#E3A47E; --accent-ink:#1B1310; --chip:#33251E; --sel:#43291C; --bad:#F2877F; --card2:#33261F; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;min-width:0}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 8px;display:flex;align-items:center;gap:10px}
header h1{font:600 24px/1.2 var(--display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.ib{background:transparent;padding:6px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.ib svg{width:26px;height:26px}
h2{font:700 17px/1.3 var(--display);margin:16px 0 8px}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--muted);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--chip);font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.45;cursor:default}
.greet{font:400 28px/1.3 var(--display);margin:22px 0 22px}
.hc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px 16px;margin-bottom:14px;font-weight:400}
.hc.p{background:linear-gradient(120deg,var(--card2),var(--chip));border-color:var(--muted)}
.hc svg.ic{width:52px;height:52px;flex:0 0 52px;color:var(--accent)}
.hc .tx{flex:1;min-width:0}
.hc b{display:block;font:700 18px/1.3 var(--display)}
.hc span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.hc svg.ar{width:22px;height:22px;flex:0 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chips button{border-radius:20px;padding:8px 16px;background:var(--chip);font-weight:500}
.chips button[aria-pressed="true"]{background:var(--sel);color:var(--accent);outline:1px solid var(--accent)}
.lab{font:700 15px var(--display);margin:14px 0 2px}
.sr{display:flex;gap:8px;align-items:center}
.sr input{border-radius:24px;padding:12px 16px;flex:1}
.prod{border-bottom:1px solid var(--line);padding:10px 2px;min-width:0}
.pn{font:600 15px/1.3 var(--display);color:var(--accent);letter-spacing:.03em;overflow-wrap:anywhere}
.ps{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.pr{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-top:6px}
.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.f.q{width:78px}.f.u{width:100px}
.step{display:flex}
.step button{width:42px;height:42px;padding:0;font-size:22px;border-radius:0;background:var(--chip)}
.step button:first-child{border-radius:21px 0 0 21px}.step button:last-child{border-radius:0 21px 21px 0}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{font:600 22px/1.3 var(--display);margin:0 0 10px}
.card p{margin:0 0 8px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
.hint{color:var(--muted);font-size:12.5px}
.qc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;min-width:0}
.qc .nm{font:700 18px/1.3 var(--display);overflow-wrap:anywhere;padding-right:40%}
.qc .dt{color:var(--muted);margin-top:2px}
.qc .tags{position:absolute;top:0;right:0;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:55%}
.tag{background:var(--chip);color:var(--accent);font-weight:700;font-size:13px;padding:3px 12px;border-radius:0 18px 0 14px}
.qc .dots{position:absolute;right:6px;bottom:6px}
.menu{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.menu button{padding:8px 12px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .c{flex:1;font-weight:600}
.bar button{padding:12px 20px}
.sheet{background-color:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:18px 16px;margin-bottom:12px;background-repeat:repeat}
.sheet h3{font:800 24px/1.2 var(--display);margin:0}
.sheet .ph{margin:0;font-weight:600}
.sheet .ti{font:700 14px var(--display);letter-spacing:.2em;margin:12px 0 8px;border-top:2px solid var(--paper-ink);padding-top:8px}
.sheet .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-bottom:10px}
.sheet .meta span:nth-child(odd){color:#6c5f56}
.sheet .tw{overflow-x:auto}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet th,.sheet td{padding:6px 6px;border-bottom:1px solid var(--paper-line);text-align:left;vertical-align:top}
.sheet th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6c5f56}
.sheet td.r,.sheet th.r{text-align:right;white-space:nowrap}
.sheet tr.cg td{font-weight:700;background:#F4EEE9;color:#241A14}
.sheet .pb{margin-top:12px;font-size:13px;color:#6c5f56}
.ib.sm{width:36px;height:36px;padding:4px}
.chips button.addchip{background:transparent;border:1.5px dashed var(--accent);color:var(--accent);padding:8px 18px;font-size:18px;line-height:1.2}
.mkform{margin:8px 0 10px}
.chips button.xchip{background:var(--chip);color:var(--bad);outline:1px solid var(--bad)}
.delbox{border-color:var(--bad);margin:8px 0 10px}
.ib.sm svg{width:22px;height:22px}
.prod.dragging{position:relative;z-index:4;background:var(--sel);box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:10px;pointer-events:none}
.prod.dropbefore{box-shadow:0 -3px 0 var(--accent)}
.prod.dropafter{box-shadow:0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:9;font-size:14px;max-width:90vw;text-align:center}
</style>

</head>

    if(pf){
      var p=pf.id?itemById(pf.id):null,cid=pf.cat||(p?p.cat:(S.cats[0]||{}).id),subName=pf.sub!==undefined?pf.sub:(p?((S.subs.filter(function(s){return s.id===p.sub})[0]||{}).name||''):'');
      h+='<div class="card"><div class="stack"><label class="f">'+t('pname')+'<input id="pfn" value="'+esc(pf.name!==undefined?pf.name:(p?p.name:''))+'"></label>'
        +'<label class="f">'+t('category')+'<select id="pfc">'+catOpts(cid)+'</select></label>'
        +'<label class="f">'+t('subName')+'<input id="pfs" list="sublist" value="'+esc(subName)+'"></label><datalist id="sublist">'+S.subs.filter(function(s){return s.cat===cid}).map(function(s){return '<option value="'+esc(s.name)+'">'}).join('')+'</datalist>'
        +'<label class="f">'+t('defUnit')+'<select id="pfu">'+unitOpts(p?p.unit:'NOS')+'</select></label></div>'
        +'<div class="row" style="margin-top:12px"><button class="primary" id="pfSave">'+t('saveP')+'</button><button class="ghost" id="pfCancel">'+t('cancel')+'</button></div>'
        +(p?'<div style="margin-top:10px">'+(confirmDel==='p'+p.id?'<button class="danger" data-delp="'+p.id+'">'+t('sure')+'</button> <button class="ghost" data-delx="1">'+t('cancel')+'</button>':'<button class="ghost" data-delpa="'+p.id+'">'+t('del')+'</button>')+'</div>':'')+'</div>';
    }
    if(catForm){
      h+='<div class="card"><div class="stack"><div class="row" style="align-items:flex-end"><label class="f" style="flex:2 1 160px">'+t('catName')+'<input id="cfn"></label><label class="f" style="flex:1 1 80px">'+t('icon')+'<input id="cfi" maxlength="4"></label></div>'
        +'<button class="primary" id="cfAdd">'+t('addCatBtn')+'</button><hr style="border:0;border-top:1px solid var(--line);width:100%">'
        +'<label class="f">'+t('inCat')+'<select id="cfsc">'+catOpts(S.cats[0]&&S.cats[0].id)+'</select></label><label class="f">'+t('newSub')+'<input id="cfsn"></label>'
        +'<button class="primary" id="cfsAdd">'+t('addSubBtn')+'</button><button class="ghost" id="cfClose">'+t('cancel')+'</button></div></div>';
    }
    h+='<div class="lab">'+t('category')+'</div><div class="chips"><button data-pcat="all" aria-pressed="'+(pcat==='all')+'">'+t('all')+'</button>'+S.cats.map(function(k){return '<button data-pcat="'+k.id+'" aria-pressed="'+(pcat===k.id)+'">'+esc(cl(k))+'</button>'}).join('')+'</div>';
    if(S.sample)h+='<p class="hint">'+t('sample')+'</p>';
    var list=S.items.filter(function(i){return (pcat==='all'||i.cat===pcat)&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>-1)});
    if(!list.length)h+='<div class="empty">'+t('noProd')+'</div>';
    list.forEach(function(i){
      var c=catById(i.cat),s=S.subs.filter(function(x){return x.id===i.sub})[0];
      h+='<div class="prod" data-pid="'+i.id+'" style="display:flex;align-items:center;gap:4px"><div style="flex:1;min-width:0"><div class="pn">'+esc(i.name)+'</div><div class="ps">'+esc(c?cl(c):'')+(s?' / '+esc(s.name):'')+' · '+esc(i.unit)+'</div></div>'
        +'<button class="ib sm" data-editp="'+i.id+'" aria-label="'+t('edit')+'">'+IC.pen+'</button>'+rctl(i.id)+'</div>';
    });
    return h;
  }

  function vSettings(){
    var h='<div class="card"><h3>'+t('profile')+'</h3><div class="stack">'
      +'<label class="f">'+t('profName')+'<input id="sp" value="'+esc(S.profile)+'"></label>'
      +'<label class="f">'+t('wmName')+'<input id="sw" value="'+esc(S.wmName)+'"></label>'
      +'<label class="f">'+t('wmPhone')+'<input id="sph" inputmode="tel" value="'+esc(S.wmPhone)+'"></label>'
      +'<label class="f">'+t('language')+'<select id="sl"><option value="en"'+(S.lang==='en'?' selected':'')+'>English</option><option value="ta"'+(S.lang==='ta'?' selected':'')+'>தமிழ்</option></select></label>'
      +'<button class="primary" id="sSave">'+t('update')+'</button></div></div>';
    h+='<div class="card"><h3>'+t('backup')+'</h3><p>'+t('backupD')+'</p><p style="color:var(--ink)">'+t('lastBackup')+': '+(S.backupAt?new Date(S.backupAt).toLocaleString(S.lang==='ta'?'ta-IN':'en-GB'):t('none'))+'</p>'
      +'<button class="primary" id="bNow" style="width:100%">'+t('backupNow')+'</button>'
      +(backupShow?'<label class="f" style="margin-top:10px">'+t('backupText')+'<textarea id="bTxt" readonly>'+esc(backupShow)+'</textarea></label>':'')+'</div>';
    h+='<div class="card"><h3>'+t('restore')+'</h3><p>'+t('restoreD')+'</p><textarea id="rTxt" aria-label="'+t('restore')+'">'+esc(restoreTxt)+'</textarea>'
      +'<div style="margin-top:10px">'+(confirmRestore?'<button class="danger" id="rOk">'+t('sure')+'</button> <button class="ghost" id="rNo">'+t('cancel')+'</button>':'<button class="primary" id="rNow" style="width:100%"'+(restoreTxt.trim()?'':' disabled')+'>'+t('restoreNow')+'</button>')+'</div></div>';
    return h;
  }

  function render(){
    var titles={home:'home',make:'make',list:'qlist',products:'prods',settings:'settings',preview:'quotation'};
    var hd=document.getElementById('hd');
    var title=view==='preview'?t('quotation'):t(titles[view]);
    var right='';
    if(view==='products')right='<button class="ib" id="addP" aria-label="'+t('addProd')+'">'+IC.addbox+'</button><button class="ib" id="addC" aria-label="'+t('addCat')+'">'+IC.mark+'</button>';
    hd.innerHTML=(view==='home'?'':'<button class="ib" data-back="1" aria-label="'+t('back')+'">'+IC.back+'</button>')+'<h1>'+esc(title)+'</h1>'+right;
    var fns={home:vHome,make:vMake,list:vList,products:vProducts,settings:vSettings,preview:vPreview};
    document.getElementById('view').innerHTML=fns[view]();
    var bar=document.getElementById('bar');
    if(view==='make'){bar.hidden=false;bar.innerHTML='<div><span class="c num">'+selCount()+' '+t('selected')+'</span><button class="ghost" id="dClear">'+t('clear')+'</button><button class="primary" id="dSave">'+t('save')+'</button></div>'}
    else bar.hidden=true;
  }

  /* ---------- actions ---------- */
  function saveQuote(){
    var D=S.draft;
    if(!D.cust.trim()){toast(t('needName'));return}
    var lines=[];S.items.forEach(function(i){var l=D.lines[i.id];if(l&&l.qty>0)lines.push({name:i.name,qty:l.qty,unit:l.unit,size:l.size||'',su:l.size?(l.su||'cm'):'',cat:i.cat,sub:i.sub})});
    if(!lines.length){toast(t('needItem'));return}
    lines.sort(function(a,b){return a.cat-b.cat});
    var x=D.editId?quoteById(D.editId):null;
    if(x){x.cust=D.cust.trim();x.phone=D.phone.trim();x.lines=lines;toast(t('updatedQ'))}
    else{x={id:S.nextId++,no:S.nextNo++,ts:Date.now(),cust:D.cust.trim(),phone:D.phone.trim(),lines:lines};S.quotes.push(x);toast(t('saved'))}
    S.draft={cust:'',phone:'',cat:D.cat,sub:'all',lines:{},editId:null};onlySel=false;
    save();qcur=x.id;go('preview');
  }
  function editQuote(id){
    var x=quoteById(id);if(!x)return;var lines={},miss=0;
    x.lines.forEach(function(l){
      var it=S.items.filter(function(i){return i.name===l.name&&i.cat===l.cat})[0];
      if(it)lines[it.id]={qty:l.qty,unit:l.unit,size:l.size||'',su:l.su||S.lastSU||'cm'};else miss++;
    });
    S.draft={cust:x.cust,phone:x.phone,cat:x.lines[0]?x.lines[0].cat:S.draft.cat,sub:'all',lines:lines,editId:x.id};
    save();go('make');if(miss)toast(miss+' '+t('skipped'));
  }
  function setLine(id,qty,unit,size,su){
    var it=itemById(id);if(!it)return;
    var l=S.draft.lines[id]||{qty:0,unit:it.unit,size:'',su:S.lastSU||'cm'};
    if(qty!==null&&qty!==undefined)l.qty=Math.max(0,+(+qty).toFixed(3));
    if(unit!==null&&unit!==undefined)l.unit=unit;
    if(size!==null&&size!==undefined)l.size=size;
    if(su!==null&&su!==undefined){l.su=su;S.lastSU=su}
    S.draft.lines[id]=l;save();
  }
  function subIdFor(cat,name){
    name=name.trim().toUpperCase();if(!name)return null;
    var s=S.subs.filter(function(x){return x.cat===cat&&x.name.toUpperCase()===name})[0];
    if(!s){s={id:S.nextId++,cat:cat,name:name};S.subs.push(s)}
    return s.id;
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var d=b.dataset,id;
    if(d.go){go(d.go);return}
    if(d.back){go(view==='preview'?'list':'home');return}
    if(d.dcat){S.draft.cat=+d.dcat;S.draft.sub='all';onlySel=false;save();render();return}
    if(d.dsub){S.draft.sub=d.dsub==='all'?'all':+d.dsub;save();render();return}
    if(d.dinc||d.ddec){id=+(d.dinc||d.ddec);var cur=lineOf(id)?lineOf(id).qty:0;setLine(id,cur+(d.dinc?1:-1),null);render();return}
    if(b.id==='onlySel'){onlySel=!onlySel;reord=false;render();return}
    if(b.id==='reord'){reord=!reord;render();return}
    if(d.mvup||d.mvdn){
      var mid=+(d.mvup||d.mvdn),ids=domIds(),ix=ids.indexOf(mid),jx=ix+(d.mvup?-1:1);
      if(ix<0||jx<0||jx>=ids.length)return;
      var tmp=ids[ix];ids[ix]=ids[jx];ids[jx]=tmp;applyOrder(ids);render();return}
    if(b.id==='edChips'){ed=!ed;cdel=null;render();return}
    if(d.xcat){cdel={type:'cat',id:+d.xcat};render();return}
    if(d.xsub){cdel={type:'sub',id:+d.xsub};render();return}
    if(b.id==='cdelNo'){cdel=null;render();return}
    if(b.id==='cdelYes'&&cdel){
      var D2=S.draft;
      if(cdel.type==='cat'){
        var cid=cdel.id,gone={};
        S.items=S.items.filter(function(i){if(i.cat===cid){gone[i.id]=1;return false}return true});
        Object.keys(gone).forEach(function(k){delete D2.lines[k]});
        S.subs=S.subs.filter(function(z){return z.cat!==cid});
        S.cats=S.cats.filter(function(c){return c.id!==cid});
        if(D2.cat===cid){D2.cat=S.cats[0]?S.cats[0].id:null;D2.sub='all'}
      }else{
        var sid2=cdel.id;
        S.items.forEach(function(i){if(i.sub===sid2)i.sub=null});
        S.subs=S.subs.filter(function(z){return z.id!==sid2});
        if(D2.sub===sid2)D2.sub='all';
      }
      S.sample=false;cdel=null;save();render();toast(t('del'));return}
    if(d.mk){mk=mk===d.mk?null:d.mk;render();var mf=document.getElementById({cat:'mkcn',sub:'mksn',prod:'mkpn'}[mk]);if(mf)mf.focus();return}
    if(b.id==='mkCancel'){mk=null;render();return}
    if(b.id==='mkCatAdd'){
      var mcn=document.getElementById('mkcn').value.trim();if(!mcn){toast(t('catName'));return}
      var mid=S.nextId++;S.cats.push({id:mid,name:mcn,icon:document.getElementById('mkci').value.trim()});
      S.draft.cat=mid;S.draft.sub='all';S.sample=false;mk=null;save();render();toast(t('addCatBtn'));return}
    if(b.id==='mkSubAdd'){
      var msn=document.getElementById('mksn').value.trim();if(!msn){toast(t('newSub'));return}
      if(!S.draft.cat){toast(t('category'));return}
      S.draft.sub=subIdFor(S.draft.cat,msn);S.sample=false;mk=null;save();render();toast(t('addSubBtn'));return}
    if(b.id==='mkProdAdd'){
      var mpn=document.getElementById('mkpn').value.trim().toUpperCase();if(!mpn){toast(t('pname'));return}
      if(!S.draft.cat){toast(t('category'));return}
      S.items.push({id:S.nextId++,cat:S.draft.cat,sub:S.draft.sub==='all'?null:S.draft.sub,name:mpn,unit:document.getElementById('mkpu').value});
      S.sample=false;mk=null;save();render();toast(t('saveP'));return}
    if(b.id==='dSave'){saveQuote();return}
    if(b.id==='dClear'){S.draft.lines={};S.draft.editId=null;save();render();return}
    if(d.menu){menuOpen=menuOpen===+d.menu?null:+d.menu;confirmDel=null;render();return}
    if(d.viewq){qcur=+d.viewq;go('preview');return}
    if(d.editq){editQuote(+d.editq);return}
    if(d.copyq){var x=quoteById(+d.copyq);if(x)copy(quoteText(x));return}
    if(d.delqa){confirmDel='q'+d.delqa;render();return}
    if(d.delx){confirmDel=null;render();return}
    if(d.delq){var qi=+d.delq;S.quotes=S.quotes.filter(function(z){return z.id!==qi});menuOpen=null;confirmDel=null;save();render();return}
    if(b.id==='addP'){pf={id:null};catForm=false;render();return}
    if(b.id==='addC'){catForm=!catForm;pf=null;render();return}
    if(d.editp){pf={id:+d.editp};catForm=false;confirmDel=null;window.scrollTo(0,0);render();return}
    if(d.pcat){pcat=d.pcat==='all'?'all':+d.pcat;render();return}
    if(b.id==='pfCancel'){pf=null;confirmDel=null;render();return}
    if(b.id==='pfSave'){
      var nm=document.getElementById('pfn').value.trim().toUpperCase();if(!nm){toast(t('pname'));return}
      var c=+document.getElementById('pfc').value,sid=subIdFor(c,document.getElementById('pfs').value),un=document.getElementById('pfu').value;
      if(pf.id){var it=itemById(pf.id);it.name=nm;it.cat=c;it.sub=sid;it.unit=un}
      else S.items.push({id:S.nextId++,cat:c,sub:sid,name:nm,unit:un});
      S.sample=false;pf=null;save();render();toast(t('saveP'));return}
    if(d.delpa){confirmDel='p'+d.delpa;render();return}
    if(d.delp){var pi=+d.delp;S.items=S.items.filter(function(i){return i.id!==pi});delete S.draft.lines[pi];S.sample=false;pf=null;confirmDel=null;save();render();return}
    if(b.id==='cfClose'){catForm=false;render();return}
    if(b.id==='cfAdd'){var cn=document.getElementById('cfn').value.trim();if(!cn){toast(t('catName'));return}
      S.cats.push({id:S.nextId++,name:cn,icon:document.getElementById('cfi').value.trim()});S.sample=false;save();render();toast(t('addCatBtn'));return}
    if(b.id==='cfsAdd'){var sn=document.getElementById('cfsn').value.trim();if(!sn){toast(t('newSub'));return}
      subIdFor(+document.getElementById('cfsc').value,sn);save();render();toast(t('addSubBtn'));return}
    if(b.id==='sSave'){
      S.profile=document.getElementById('sp').value.trim();S.wmName=document.getElementById('sw').value.trim();S.wmPhone=document.getElementById('sph').value.trim();S.lang=document.getElementById('sl').value;
      save();render();toast(t('updated'));return}
    if(b.id==='bNow'){var js=JSON.stringify(S);S.backupAt=Date.now();save();backupShow=js;render();copy(js,t('copied'));return}
    if(b.id==='rNow'){confirmRestore=true;render();return}
    if(b.id==='rNo'){confirmRestore=false;render();return}
    if(b.id==='rOk'){
      try{var o=JSON.parse(restoreTxt);if(!o||!o.cats||!o.items||!o.quotes)throw 0;
        S=Object.assign({},S,o);S.draft=Object.assign({cust:'',phone:'',cat:null,sub:'all',lines:{},editId:null},o.draft||{});save();restoreTxt='';backupShow='';confirmRestore=false;render();toast(t('restored'))}
      catch(err){confirmRestore=false;render();toast(t('badBackup'))}
      return}
  });
  document.addEventListener('change',function(e){
    var t0=e.target,d=t0.dataset;
    if(d.dq){setLine(+d.dq,parseFloat(t0.value)||0,null);render();return}
    if(d.du){setLine(+d.du,null,t0.value);render();return}
    if(d.ds){setLine(+d.ds,null,null,t0.value.replace(/\s*[xX*×]\s*/g,'×').trim(),null);render();return}
    if(d.dsu){setLine(+d.dsu,null,null,null,t0.value);render();return}
    if(t0.id==='pfc'){pf=pf||{};pf.cat=+t0.value;pf.sub='';var n=document.getElementById('pfn');pf.name=n?n.value:'';render();return}
  });
  document.addEventListener('input',function(e){
    var t0=e.target,id=t0.id;
    function refocus(inp){var p=t0.selectionStart;render();var n=document.getElementById(inp);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}
    if(id==='q'){q=t0.value;refocus('q');return}
    if(id==='qp'){q=t0.value;refocus('qp');return}
    if(id==='q2'){q2=t0.value;refocus('q2');return}
    if(id==='dcust'){S.draft.cust=t0.value;save();return}
    if(id==='dphone'){S.draft.phone=t0.value;save();return}
    if(id==='rTxt'){var was=!!restoreTxt.trim();restoreTxt=t0.value;if(was!==!!restoreTxt.trim()){var p=t0.selectionStart;render();var n=document.getElementById('rTxt');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}return}
  });
  var drag=null;
  function clearDrop(){[].forEach.call(document.querySelectorAll('.dropbefore,.dropafter'),function(n){n.classList.remove('dropbefore','dropafter')})}
  document.addEventListener('pointerdown',function(e){
    var h=e.target.closest('[data-drag]');if(!h)return;
    var row=h.closest('.prod');if(!row)return;
    e.preventDefault();
    drag={row:row,id:+h.dataset.drag,y0:e.clientY,s0:window.scrollY,over:null,after:false,lastY:e.clientY};
    row.classList.add('dragging');
    try{h.setPointerCapture(e.pointerId)}catch(x){}
  });
  document.addEventListener('pointermove',function(e){
    if(!drag)return;
    var y=e.clientY;drag.lastY=y;
    if(y<100)window.scrollBy(0,-14);else if(y>window.innerHeight-130)window.scrollBy(0,14);
    drag.row.style.transform='translateY('+(y-drag.y0+(window.scrollY-drag.s0))+'px)';
    clearDrop();
    var el=document.elementFromPoint(window.innerWidth/2,y),over=el&&el.closest?el.closest('.prod[data-pid]'):null;
    if(over&&over!==drag.row){var r=over.getBoundingClientRect();drag.after=y>r.top+r.height/2;drag.over=over;over.classList.add(drag.after?'dropafter':'dropbefore')}
    else drag.over=null;
  });
  function endDrag(){
    if(!drag)return;var d=drag;drag=null;clearDrop();
    d.row.style.transform='';d.row.classList.remove('dragging');
    if(d.over){
      var ids=domIds().filter(function(i){return i!==d.id}),ox=ids.indexOf(+d.over.dataset.pid);
      if(ox>=0){ids.splice(d.after?ox+1:ox,0,d.id);applyOrder(ids)}
    }
    render();
  }
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
  render();
})();
</script>
</body>
</html>
